<!DOCTYPE html>
<html>
<head>
  <title>Madani Donation Box Dashboard</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body { font-family: Arial; margin: 20px; }
    select { padding: 6px; margin-right: 10px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    th { background: #f2f2f2; }
    #summary table { margin-top: 20px; }
  </style>
</head>

<body>
  <h2>Madani Donation Box Dashboard</h2>

  <label>City:</label>
  <select id="city"></select>

  <label>Month:</label>
  <select id="month"></select>

  <div id="summary"></div>

  <div id="table"></div>

  <script>
    google.charts.load('current', { packages: ['table'] });
    google.charts.setOnLoadCallback(loadData);

    let sheetData = [];

    function loadData() {
      const query = new google.visualization.Query(
        "https://docs.google.com/spreadsheets/d/1sbYovp6RHpBXd1lfz0iRXxR9wUAo7NuW_JGcRPUMQr0/gviz/tq?sheet=Sheet1&range=A:M"
      );

      query.send(response => {
        const data = response.getDataTable();
        sheetData = [];

        for (let i = 0; i < data.getNumberOfRows(); i++) {

          // Extract timestamp
          const timestamp = data.getValue(i, 0);

          // Extract Month column (L)
          let month = data.getValue(i, 11);

          // Normalize Month values (remove trailing spaces + invisible Unicode NBSP)
          if (month) {
            month = month.trim().replace(/\u00A0/g, "");
          }

          // If Month is empty, extract from Timestamp
          if (!month && timestamp) {
            const d = new Date(timestamp);
            const m = d.toLocaleString("default", { month: "long" });
            const y = d.getFullYear();
            month = `${m} ${y}`;  // Option A
          }

          sheetData.push({
            Timestamp: timestamp, // NOT displayed
            Email: data.getValue(i, 1),
            City: data.getValue(i, 2),
            TotalBoxes: data.getValue(i, 3),
            ActiveBoxes: data.getValue(i, 4),
            DeactiveBoxes: data.getValue(i, 5),
            BoxesAdd: data.getValue(i, 6),
            TotalCurrentBoxes: data.getValue(i, 7),
            TotalIncome: data.getValue(i, 8),
            BoxesInHand: data.getValue(i, 9),
            Name: data.getValue(i, 10),
            Month: month,
            AvgIncomeActiveBox: data.getValue(i, 12)
          });
        }

        populateFilters();
        filterData();
      });
    }

    function populateFilters() {
      const cities = [...new Set(sheetData.map(r => r.City))];
      const months = [...new Set(sheetData.map(r => r.Month))];

      fillDropdown('city', cities);
      fillDropdown('month', months);

      document.getElementById('city').onchange = filterData;
      document.getElementById('month').onchange = filterData;
    }

    function fillDropdown(id, items) {
      const dropdown = document.getElementById(id);
      dropdown.innerHTML = '<option value="">All</option>';
      items.forEach(item => {
        dropdown.innerHTML += `<option value="${item}">${item}</option>`;
      });
    }

    function filterData() {
      const city = document.getElementById('city').value;
      const month = document.getElementById('month').value;

      let filtered = sheetData;

      if (city) filtered = filtered.filter(r => r.City === city);
      if (month) filtered = filtered.filter(r => r.Month === month);

      renderSummary(filtered);
      renderTable(filtered);
    }

    // ⭐ STEP 1: Calculate totals + averages
    function calculateIncomeByCityMonth(data) {
      const totals = {};

      data.forEach(row => {
        const city = row.City || "Unknown";
        const month = row.Month || "Unknown";
        const income = parseFloat(row.TotalIncome) || 0;

        const key = `${city}__${month}`;

        if (!totals[key]) {
          totals[key] = { total: 0, count: 0 };
        }

        totals[key].total += income;
        totals[key].count += 1;
      });

      return totals;
    }

    // ⭐ STEP 2: Currency formatting
    function formatCurrency(amount) {
      return `$${amount.toFixed(2)}`;
    }

    // ⭐ STEP 3: Render summary (sorted by highest total income)
    function renderSummary(filtered) {
      const totals = calculateIncomeByCityMonth(filtered);

      let entries = Object.keys(totals).map(key => {
        const [city, month] = key.split("__");
        const total = totals[key].total;
        const avg = total / totals[key].count;
        return { city, month, total, avg };
      });

      // Sort by highest total income (Option 3)
      entries.sort((a, b) => b.total - a.total);

      let html = "<h3>Total & Average Income per City per Month</h3>";
      html += "<table><tr><th>City</th><th>Month</th><th>Total Income</th><th>Average Income</th></tr>";

      entries.forEach(e => {
        html += `
          <tr>
            <td>${e.city}</td>
            <td>${e.month}</td>
            <td>${formatCurrency(e.total)}</td>
            <td>${formatCurrency(e.avg)}</td>
          </tr>
        `;
      });

      html += "</table>";

      document.getElementById("summary").innerHTML = html;
    }

    // ⭐ STEP 4: Render main table with currency formatting
    function renderTable(rows) {
      if (!rows.length) {
        document.getElementById('table').innerHTML = "<p>No data found.</p>";
        return;
      }

      let html = "<table><tr>";

      // Hide Timestamp column
      const columns = Object.keys(rows[0]).filter(c => c !== "Timestamp");

      columns.forEach(col => html += `<th>${col}</th>`);
      html += "</tr>";

      rows.forEach(r => {
        html += "<tr>";
        columns.forEach(key => {
          let value = r[key];

          if (key === "TotalIncome" || key === "AvgIncomeActiveBox") {
            const num = parseFloat(value);
            value = isNaN(num) ? value : `$${num.toFixed(2)}`;
          }

          html += `<td>${value}</td>`;
        });
        html += "</tr>";
      });

      html += "</table>";
      document.getElementById('table').innerHTML = html;
    }
  </script>
</body>
</html>
