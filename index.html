<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dawateislami USA Donation Box Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <!-- Google Charts -->
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    :root {
      --bg-main: #111827;
      --bg-card: #1f2937;
      --bg-toolbar: #0f172a;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --accent: #22c55e;
      --accent-soft: #16a34a;
      --border-soft: #374151;
      --danger: #ef4444;
    }

    body {
      background: #0b1120;
      color: var(--text-main);
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: var(--bg-card);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      max-width: 1200px;
      margin: auto;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      background: var(--bg-toolbar);
      padding: 10px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .toolbar-btn {
      background: transparent;
      border: 1px solid var(--border-soft);
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .toolbar-btn.active {
      background: var(--accent-soft);
      color: #0b1120;
      border-color: var(--accent-soft);
    }

    .btn {
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: var(--accent-soft);
      color: #0b1120;
      font-weight: 600;
    }

    .btn-danger {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    .section {
      display: none;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: var(--text-main);
    }

    th, td {
      padding: 6px;
      border-bottom: 1px solid #1f2937;
    }

    th {
      background: #020617;
    }
  </style>
</head>

<body>
  <div id="loginBox" class="card">
    <h1>Dawateislami USA Donation Box Dashboard</h1>
    <p>Sign in with Google to continue.</p>
    <button id="googleLoginBtn" class="btn">Sign in with Google</button>
  </div>

  <div id="dashboard" class="card" style="display:none;">
    <div class="toolbar">
      <div>
        <button id="toolbarCharts" class="toolbar-btn">Charts</button>
        <button id="toolbarIncome" class="toolbar-btn">Income Table</button>
        <button id="toolbarSheet" class="toolbar-btn">Raw Sheet Data</button>
      </div>
      <button id="logoutBtn" class="btn-danger">Logout</button>
    </div>

    <div id="chartsSection" class="section">
      <h2>Donation Box Charts</h2>
      <div id="chartCityMonth" style="width:100%;height:300px;"></div>
      <div id="chartPerBox" style="width:100%;height:300px;margin-top:20px;"></div>
    </div>

    <div id="incomeSection" class="section">
      <h2>Total & Average Income per City per Month</h2>
      <table id="incomeTable">
        <thead>
          <tr>
            <th>City</th>
            <th>Month</th>
            <th>Total Income</th>
            <th>Average per Active Box</th>
            <th>Active Boxes</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="sheetSection" class="section">
      <h2>Raw Google Sheet Data (Columns B–M)</h2>
      <table id="sheetTable">
        <thead>
          <tr>
            <th>B</th><th>C</th><th>D</th><th>E</th><th>F</th><th>G</th>
            <th>H</th><th>I</th><th>J</th><th>K</th><th>L</th><th>M</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

<script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyAiBGgA29BzD3CESWM2m4inxaWssA8fOZE",
    authDomain: "donation-boxes-79ff0.firebaseapp.com",
    projectId: "donation-boxes-79ff0",
    storageBucket: "donation-boxes-79ff0.firebasestorage.app",
    messagingSenderId: "655743529358",
    appId: "1:655743529358:web:c13d1d02b9863f54b834df",
    measurementId: "G-GMEDXC6PK8"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  google.charts.load("current", { packages: ["corechart"] });

  let sheetData = [];
  let incomeSummary = [];

  function showSection(id) {
    ["chartsSection", "incomeSection", "sheetSection"].forEach(sec => {
      document.getElementById(sec).style.display = sec === id ? "block" : "none";
    });
  }

  function setActiveToolbar(id) {
    ["toolbarCharts", "toolbarIncome", "toolbarSheet"].forEach(btn => {
      document.getElementById(btn).classList.toggle("active", btn === id);
    });
  }

  function loadDataFromSheet() {
    const query = new google.visualization.Query(
      "https://docs.google.com/spreadsheets/d/1sbYovp6dBjkB1x1PdRiK8XnALu67N4AJ_3GcRPLuRP4/gviz/tq?sheet=Sheet1&range=A:M"
    );

    query.send(response => {
      const data = response.getDataTable();
      sheetData = [];
      incomeSummary = [];

      for (let i = 0; i < data.getNumberOfRows(); i++) {
        const row = [];
        for (let c = 0; c < 13; c++) row.push(data.getValue(i, c));
        sheetData.push(row);

        incomeSummary.push({
          city: row[2],
          month: row[11],
          total: row[7],
          average: row[12],
          activeBoxes: row[4]
        });
      }

      drawCharts();
      renderIncomeTable();
      renderSheetTable();
    });
  }

  function drawCharts() {
    const cityMonth = new google.visualization.DataTable();
    cityMonth.addColumn("string", "City-Month");
    cityMonth.addColumn("number", "Total Income");

    incomeSummary.forEach(r => {
      cityMonth.addRow([`${r.city} (${r.month})`, Number(r.total)]);
    });

    new google.visualization.ColumnChart(
      document.getElementById("chartCityMonth")
    ).draw(cityMonth, { backgroundColor: "transparent" });

    const perBox = new google.visualization.DataTable();
    perBox.addColumn("string", "City");
    perBox.addColumn("number", "Avg Income");

    incomeSummary.forEach(r => {
      perBox.addRow([r.city, Number(r.average)]);
    });

    new google.visualization.ColumnChart(
      document.getElementById("chartPerBox")
    ).draw(perBox, { backgroundColor: "transparent" });
  }

  function renderIncomeTable() {
    const tbody = document.querySelector("#incomeTable tbody");
    tbody.innerHTML = "";
    incomeSummary.forEach(r => {
      tbody.innerHTML += `
        <tr>
          <td>${r.city}</td>
          <td>${r.month}</td>
          <td>${r.total}</td>
          <td>${r.average}</td>
          <td>${r.activeBoxes}</td>
        </tr>`;
    });
  }

  function renderSheetTable() {
    const tbody = document.querySelector("#sheetTable tbody");
    tbody.innerHTML = "";
    sheetData.forEach(r => {
      tbody.innerHTML += `
        <tr>
          ${r.slice(1, 13).map(v => `<td>${v}</td>`).join("")}
        </tr>`;
    });
  }

  window.onload = () => {
    const loginBox = document.getElementById("loginBox");
    const dashboard = document.getElementById("dashboard");

    document.getElementById("googleLoginBtn").onclick = () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).then(() => {
        loginBox.style.display = "none";
        dashboard.style.display = "block";
        google.charts.setOnLoadCallback(loadDataFromSheet);
      });
    };

    document.getElementById("logoutBtn").onclick = () => {
      auth.signOut().then(() => {
        dashboard.style.display = "none";
        loginBox.style.display = "block";
      });
    };

    document.getElementById("toolbarCharts").onclick = () => {
      setActiveToolbar("toolbarCharts");
      showSection("chartsSection");
      drawCharts();
    };

    document.getElementById("toolbarIncome").onclick = () => {
      setActiveToolbar("toolbarIncome");
      showSection("incomeSection");
      renderIncomeTable();
    };

    document.getElementById("toolbarSheet").onclick = () => {
      setActiveToolbar("toolbarSheet");
      showSection("sheetSection");
      renderSheetTable();
    };
  };
</script>

</body>
</html>
