<!DOCTYPE html>
<html>
<head>
  <title>Madani Donation Box Dashboard</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body { font-family: Arial; margin: 20px; }
    select { padding: 6px; margin-right: 10px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    th { background: #f2f2f2; }
  </style>
</head>

<body>
  <h2>Madani Donation Box Dashboard</h2>

  <label>City:</label>
  <select id="city"></select>

  <label>Month:</label>
  <select id="month"></select>

  <div id="table"></div>

  <script>
    google.charts.load('current', { packages: ['table'] });
    google.charts.setOnLoadCallback(loadData);

    let sheetData = [];

    function loadData() {
      const query = new google.visualization.Query(
        "https://docs.google.com/spreadsheets/d/1sbYovp6RHpBXd1lfz0iRXxR9wUAo7NuW_JGcRPUMQr0/gviz/tq?sheet=Sheet1&range=B:M"
      );

      query.send(response => {
        const data = response.getDataTable();
        sheetData = [];

        for (let i = 0; i < data.getNumberOfRows(); i++) {
          sheetData.push({
            Email: data.getValue(i, 0),
            City: data.getValue(i, 1),
            TotalBoxes: data.getValue(i, 2),
            ActiveBoxes: data.getValue(i, 3),
            DeactiveBoxes: data.getValue(i, 4),
            BoxesAdd: data.getValue(i, 5),
            TotalCurrentBoxes: data.getValue(i, 6),
            TotalIncome: data.getValue(i, 7),
            BoxesInHand: data.getValue(i, 8),
            Name: data.getValue(i, 9),
            Month: data.getValue(i, 10),
            AvgIncomeActiveBox: data.getValue(i, 11)
          });
        }

        populateFilters();
        renderTable(sheetData);
      });
    }

    function populateFilters() {
      const cities = [...new Set(sheetData.map(r => r.City))];
      const months = [...new Set(sheetData.map(r => r.Month))];

      fillDropdown('city', cities);
      fillDropdown('month', months);

      document.getElementById('city').onchange = filterData;
      document.getElementById('month').onchange = filterData;
    }

    function fillDropdown(id, items) {
      const dropdown = document.getElementById(id);
      dropdown.innerHTML = '<option value="">All</option>';
      items.forEach(item => {
        dropdown.innerHTML += `<option value="${item}">${item}</option>`;
      });
    }

    function filterData() {
      const city = document.getElementById('city').value;
      const month = document.getElementById('month').value;

      let filtered = sheetData;

      if (city) filtered = filtered.filter(r => r.City === city);
      if (month) filtered = filtered.filter(r => r.Month === month);

      renderTable(filtered);
    }

    function renderTable(rows) {
      if (!rows.length) {
        document.getElementById('table').innerHTML = "<p>No data found.</p>";
        return;
      }

      let html = "<table><tr>";

      Object.keys(rows[0]).forEach(col => html += `<th>${col}</th>`);
      html += "</tr>";

      rows.forEach(r => {
        html += "<tr>";
        Object.values(r).forEach(v => html += `<td>${v}</td>`);
        html += "</tr>";
      });

      html += "</table>";
      document.getElementById('table').innerHTML = html;
    }
  </script>
</body>
</html>
