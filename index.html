<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Donation Box Dashboard</title>

  <!-- Material UI CDN -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>

  <style>
    body {
      font-family: Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .city-card {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <h1 style="text-align:center; margin-bottom:30px;">Donation Box Dashboard</h1>

  <div id="dashboard"></div>

  <script>
    // ---------------------------
    // Firebase Config
    // ---------------------------
    const firebaseConfig = {
  apiKey: "AIzaSyAiBGgA29BzD3CESWM2m4inxaWssA8fOZE",
  authDomain: "donation-boxes-79ff0.firebaseapp.com",
  projectId: "donation-boxes-79ff0",
  storageBucket: "donation-boxes-79ff0.firebasestorage.app",
  messagingSenderId: "655743529358",
  appId: "1:655743529358:web:c13d1d02b9863f54b834df",
  measurementId: "G-GMEDXC6PK8"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ---------------------------
    // Authentication Check
    // ---------------------------
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        document.body.innerHTML = "<h2>Please login to access the dashboard.</h2>";
        return;
      }
      loadDashboard();
    });

    // ---------------------------
    // Load Dashboard Data
    // ---------------------------
    async function loadDashboard() {
      const dashboard = document.getElementById("dashboard");
      dashboard.innerHTML = "<h3>Loading data...</h3>";

      const snapshot = await db.collection("cities").get();
      const cities = snapshot.docs.map(doc => doc.data());

      // Sort cities alphabetically
      cities.sort((a, b) => a.cityName.localeCompare(b.cityName));

      dashboard.innerHTML = "";

      cities.forEach(city => {
        const card = createCityCard(city);
        dashboard.appendChild(card);
      });
    }

    // ---------------------------
    // Create City Card
    // ---------------------------
    function createCityCard(city) {
      const card = document.createElement("div");
      card.className = "city-card";

      card.innerHTML = `
        <div style="background:white; padding:20px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.2);">
          <h2>${city.cityName}</h2>
          <p><strong>Supervisor:</strong> ${city.supervisor}</p>
          <hr>

          <p><strong>Total Boxes:</strong> ${city.totalBoxes}</p>
          <p><strong>Active Boxes:</strong> ${city.activeBoxes}</p>
          <p><strong>Deactive Boxes:</strong> ${city.deactiveBoxes}</p>
          <p><strong>Boxes Added:</strong> ${city.boxesAdded}</p>
          <p><strong>Current Boxes:</strong> ${city.currentBoxes}</p>

          <hr>

          <p><strong>Total Income:</strong> $${city.totalIncome.toLocaleString()}</p>
          <p><strong>Avg Income per Active Box:</strong> $${city.avgIncomePerActiveBox.toFixed(2)}</p>

          <hr>
          <h3>Monthly Income</h3>
          ${createMonthlyTable(city.monthlyIncome)}
        </div>
      `;

      return card;
    }

    // ---------------------------
    // Monthly Income Table
    // ---------------------------
    function createMonthlyTable(monthlyIncome) {
      let rows = "";

      Object.entries(monthlyIncome)
        .sort(([a], [b]) => b.localeCompare(a)) // newest first
        .forEach(([month, income]) => {
          rows += `
            <tr>
              <td>${month}</td>
              <td>$${income.toLocaleString()}</td>
            </tr>
          `;
        });

      return `
        <table border="1" cellpadding="6" style="width:100%; border-collapse:collapse;">
          <tr>
            <th>Month</th>
            <th>Income</th>
          </tr>
          ${rows}
        </table>
      `;
    }
  </script>

</body>
</html>
